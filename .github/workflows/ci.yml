name: CI
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - run: npm ci
      - run: node index.js --help
      - name: Load translator with a synthetic locale
        run: |
          mkdir -p i18n
          printf '{}\n' > i18n/en.json
          node -e "if (typeof require('./lib/translate').processTranslations !== 'function') process.exit(1)"
      - run: node -e "if (require('form-data/package.json').version !== '4.0.6') process.exit(1)"
