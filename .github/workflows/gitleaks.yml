name: Gitleaks secret scan

on:
  pull_request_target:
  push:
    branches: [main, master]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.actor == 'tarikermis' && github.triggering_actor == 'tarikermis')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout trusted base history
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: repo
          persist-credentials: false

      - name: Checkout default branch
        if: github.event_name != 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: repo
          persist-credentials: false

      - name: Materialize the trusted scan policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 600 /dev/null "$RUNNER_TEMP/gitleaks.toml"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" && "$(git -C repo cat-file -t "$BASE_SHA:.gitleaks.toml" 2>/dev/null || true)" == "blob" ]]; then
            git -C repo show "$BASE_SHA:.gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml"
          else
            printf '%s\n' 'title = "trusted default policy"' '' '[extend]' 'useDefault = true' > "$RUNNER_TEMP/gitleaks.toml"
          fi
          install -m 600 /dev/null "$RUNNER_TEMP/gitleaksignore"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request_target" ]]; then
            if [[ "$(git -C repo cat-file -t "$BASE_SHA:.gitleaksignore" 2>/dev/null || true)" == "blob" ]]; then
              git -C repo show "$BASE_SHA:.gitleaksignore" > "$RUNNER_TEMP/gitleaksignore"
            fi
          elif [[ -f repo/.gitleaksignore && ! -L repo/.gitleaksignore ]]; then
            cp repo/.gitleaksignore "$RUNNER_TEMP/gitleaksignore"
          fi

      - name: Bind the pull request head to the trusted base repository
        if: github.event_name == 'pull_request_target'
        env:
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: repo
        run: |
          set -Eeuo pipefail
          [[ "$PR_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          git remote add pull-request "https://github.com/${PR_REPOSITORY}.git"
          if git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            # Same-repository pull request: the head is already in the base clone, unchanged path.
            git fetch --no-tags pull-request "$HEAD_SHA"
          else
            # Private fork: the head is not in the base clone and the checkout kept no credentials. Fetch it read-only,
            # object data only (no checkout, hooks or PR code run here); the token is passed to the single fetch command
            # and never persisted. Primary: GitHub's refs/pull/N/head in the BASE repository (no fork credentials).
            # Fallback: the head repository itself. If neither delivers the commit, fail closed: never skip the scan.
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_READ_TOKEN" | base64 -w0)"
            echo "::add-mask::${auth#AUTHORIZATION: basic }"
            git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head" >/dev/null 2>&1 || true
            if ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
              git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags pull-request "$HEAD_SHA" >/dev/null 2>&1 || true
            fi
            if ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
              echo "::error::Pull request head ${HEAD_SHA} from ${PR_REPOSITORY} is not reachable with the read-only token (tried refs/pull/${PR_NUMBER}/head of this repository, then the head repository). Scan refused, not skipped."
              exit 1
            fi
          fi
          git checkout --detach "$HEAD_SHA"

      - name: Scan the exact pull request range
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git -C repo cat-file -e "$BASE_SHA^{commit}"
          git -C repo cat-file -e "$HEAD_SHA^{commit}"
          rm -f -- repo/.gitleaksignore
          # A .gitattributes in the scanned tree (worktree or index) can mark paths -diff/binary and hide them from git log -p:
          # remove the files, the local override and the index entries so only git's built-in defaults apply.
          find repo -path repo/.git -prune -o -name .gitattributes -exec rm -rf -- {} +
          rm -f -- repo/.git/info/attributes
          git -C repo read-tree --empty
          # -m: git log -p shows no diff for merge commits by default, so a secret that exists only in a merge
          # resolution would never be scanned (review CF24-1, 22.11.2026). -m diffs each merge against every parent.
          log_file="$RUNNER_TEMP/gitleaks-pr.log"
          set +e
          docker run --rm --network=none \
            --volume "$GITHUB_WORKSPACE/repo:/repo:ro" \
            --volume "$RUNNER_TEMP:/trusted:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git --config /trusted/gitleaks.toml --gitleaks-ignore-path /trusted/gitleaksignore --ignore-gitleaks-allow --log-opts="-m $BASE_SHA..$HEAD_SHA" \
            --no-banner --no-color --redact --log-level error /repo >"$log_file" 2>&1
          status=$?
          set -e
          rm -f -- "$log_file"
          if [ "$status" -ne 0 ]; then echo "::error::Gitleaks found a secret in the pull request range. Details are suppressed."; exit "$status"; fi

      - name: Scan complete history
        if: github.event_name != 'pull_request_target'
        shell: bash
        run: |
          set -Eeuo pipefail
          # A .gitattributes in the scanned tree (worktree or index) can mark paths -diff/binary and hide them from git log -p:
          # remove the files, the local override and the index entries so only git's built-in defaults apply.
          find repo -path repo/.git -prune -o -name .gitattributes -exec rm -rf -- {} +
          rm -f -- repo/.git/info/attributes
          git -C repo read-tree --empty
          # -m: merge commits are scanned too (see the PR-range step).
          log_file="$RUNNER_TEMP/gitleaks-history.log"
          set +e
          docker run --rm --network=none \
            --volume "$GITHUB_WORKSPACE/repo:/repo:ro" \
            --volume "$RUNNER_TEMP:/trusted:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git --config /trusted/gitleaks.toml --gitleaks-ignore-path /trusted/gitleaksignore --ignore-gitleaks-allow --log-opts="--all -m" \
            --no-banner --no-color --redact --log-level error /repo >"$log_file" 2>&1
          status=$?
          set -e
          rm -f -- "$log_file"
          if [ "$status" -ne 0 ]; then echo "::error::Gitleaks found a secret in repository history. Details are suppressed."; exit "$status"; fi
